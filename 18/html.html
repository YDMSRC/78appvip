<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>年龄验证</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#111;color:#fff;font-size:22px;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .btn-box{margin-top:30px}
        button{padding:12px 24px;font-size:18px;margin:0 10px;cursor:pointer}
        .tip{
            position:fixed;
            top:50%;left:50%;
            transform:translate(-50%,-50%) scale(0.2);
            color:red;font-size:60px;font-weight:bold;
            opacity:0;
            animation: showHide 2s forwards;
        }
        @keyframes showHide {
            0%{transform:translate(-50%,-50%) scale(0.2);opacity:0}
            40%{transform:translate(-50%,-50%) scale(1);opacity:1}
            80%{transform:translate(-50%,-50%) scale(1);opacity:1}
            100%{transform:translate(-50%,-50%) scale(0.3);opacity:0}
        }
        img{max-width:90%;max-height:70vh;margin-top:20px;display:none}
    </style>
</head>
<body>
    <div>请问你是否已满18周岁？</div>
    <div class="btn-box">
        <button onclick="go()">已满</button>
        <button onclick="no()">未满</button>
    </div>
    <img id="pic" src="这里放你的图片base64">
    <audio id="bgm" loop>
        <source src="音频base64" type="audio/mpeg">
    

<script>
function go(){
    document.getElementById('pic').style.display="block";
    document.getElementById('bgm').play();
}
function no(){
    let t = document.createElement('div');
    t.className="tip";
    t.innerText="我管你呢";
    document.body.appendChild(t);
    document.getElementById('pic').style.display="block";
    document.getElementById('bgm').play();
}
</script>
</body>
</html>
